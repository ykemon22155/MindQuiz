name: quiz_application_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase Dependencies
  firebase_core: ^3.15.0
  cloud_firestore: ^5.6.12
  # Requirement 6: needed to store uploaded profile pictures.
  firebase_storage: ^12.4.0

  # API এবং লোকাল স্টোরেজ
  http: ^1.3.0
  dio: ^5.8.0
  shared_preferences: ^2.3.5

  # Requirement 6: needed to pick a photo from camera/gallery.
  image_picker: ^1.1.2

  # Google Fonts Package
  google_fonts: ^8.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true